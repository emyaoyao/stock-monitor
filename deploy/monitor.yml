# 价格行为 · 买点监控（云端，脱离本机运行）
#
# 时区说明：GitHub Actions 的 cron 用 UTC。北京时间 = UTC+8。
#   "20 1 * * 1-5"      → 每周一至五 09:20 北京时间（盘前集合竞价）
#   "*/30 1-7 * * 1-5"  → 每周一至五 09:00–15:00 北京时间，每 30 分钟一次
# 注意：定时任务可能因平台排队延后数分钟，属正常；如需准点可用手动触发兜底。
#
# 三种触发：
#   1) schedule          —— 定时扫描，只推送「新出现」的买点信号
#   2) workflow_dispatch —— 在 GitHub 网页/手机端 Actions → 买点监控 → Run workflow，填代码增删/查看
#   3) repository_dispatch —— 由 Cloudflare Worker 桥接转发 WxPusher 微信上行消息（发「加 600519」即触发）
#
# 密钥（Settings → Secrets → Actions）：API_KEY / ZHITU_TOKEN / WXPUSHER_APP_TOKEN / WXPUSHER_UID

name: 买点监控

on:
  schedule:
    - cron: "20 1 * * 1-5"
    - cron: "*/30 1-7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run=扫描推送 / view=查看清单与买点 / help=指令说明"
        required: false
        default: "run"
      add_code:
        description: "加入监控的 6 位代码，如 600519"
        required: false
      add_name:
        description: "名称（可选）"
        required: false
      remove_code:
        description: "移除监控的 6 位代码"
        required: false
  repository_dispatch:
    types: [monitor-cmd]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行监控
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INPUTS: ${{ toJSON(github.event.inputs) }}
          DISPATCH_CLIENT: ${{ toJSON(github.event.client_payload) }}
          API_KEY: ${{ secrets.API_KEY }}
          ZHITU_TOKEN: ${{ secrets.ZHITU_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python3 monitor_cloud.py

      - name: 提交 watchlist / 去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/watchlist.json outputs/last_signals.json outputs/monitor_result.json
          if git diff --cached --quiet; then
            # 无实质变化：若距上次提交已超过 7 天，写一次心跳，防止 GitHub 在 60 天无活动后停用定时任务
            last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            now=$(date +%s)
            if [ $((now - last)) -gt 604800 ]; then
              date +%Y-%m-%dT%H:%M:%S > outputs/last_run.txt
              git add outputs/last_run.txt
              git commit -m "chore(monitor): heartbeat"
            fi
          else
            git commit -m "chore(monitor): update watchlist/state"
          fi
          # 手动触发与定时任务可能几乎同时落地，推之前先并轨，避免 non-fast-forward
          git pull --rebase --autostash origin main || true
          git push
